<app-content-page [title]="pageTitle" [breadcrumbs]="breadcrumbs">
  
  <div class="card bg-white border border-secondary-subtle rounded-0 shadow-sm p-2 p-md-3 text-center">
    
    <figure class="m-0">
      <img 
        [src]="orgChartUrl" 
        alt="Organizational Chart detailing the hierarchy and divisions of Punjab Water Regulation and Development Authority" 
        class="img-fluid w-100 rounded-0"
        loading="lazy"
      />
      
      <figcaption class="visually-hidden">
        Organizational Chart of PWRDA showing administrative hierarchy.
      </figcaption>
    </figure>

  </div>

</app-content-page>
