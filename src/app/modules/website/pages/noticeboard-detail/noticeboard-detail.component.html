<div class="container mt-4">
  <div *ngIf="loading">Loading noticeboard...</div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && noticeboard">
    <h2>{{ noticeboard.title || noticeboard.name }}</h2>
    <p>{{ noticeboard.description }}</p>
    <p>{{ noticeboard.publish_date }}</p>
  </div>
</div>
