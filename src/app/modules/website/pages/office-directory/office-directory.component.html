<app-content-page [title]="pageTitle" [breadcrumbs]="breadcrumb">

  <app-accordion-group>
    
    @for (section of sections; track section.id) {
      
      <app-accordion-item [question]="section.question">

        <div class="table-responsive">
          <table class="table align-middle mb-0 small text-dark border-top">
            <thead class="table-light">
              <tr>
                <th scope="col" class="fw-bold text-secondary">#</th>
                <th scope="col" class="fw-bold text-secondary">Name</th>
                <th scope="col" class="fw-bold text-secondary">Designation</th>
                <th scope="col" class="fw-bold text-secondary">Email</th>
              </tr>
            </thead>
            <tbody>
              
              @for (row of section.content; track row.name; let idx = $index) {
                <tr>
                  <td>{{ idx + 1 }}</td>
                  <td class="fw-medium">{{ row.name }}</td>
                  <td>{{ row.designation }}</td>
                  <td>{{ row.email }}</td>
                </tr>
              }

            </tbody>
          </table>
        </div>
        
        @if (section.note) {
          <p class="mt-3 mb-0 small text-dark">
            <span class="fw-bold">Note:</span> {{ section.note }}
          </p>
        }

      </app-accordion-item>

    }
    
  </app-accordion-group>

</app-content-page>
