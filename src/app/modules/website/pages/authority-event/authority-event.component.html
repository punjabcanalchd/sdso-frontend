
<div class="position-relative bg-primary overflow-hidden pb-4 pt-5">
  
  <img 
    [src]="eventDetails.bannerImageUrl" 
    alt="Event Banner" 
    class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover opacity-50 z-0 ">
  
  <div class="position-relative z-1 container text-center text-white pb-2 pt-5 mt-5">
    
    <div class="mt-5 pt-md-5">
      <h1 class="display-5 fw-bold fs-3 mb-3 text-uppercase">{{ eventDetails.title }}</h1>
      <p class="lead mb-0 fs-6 px-md-5 ">{{ eventDetails.description }}</p>
      
      <div class="row justify-content-center mt-4">
        <div class="col-4 col-md-2 col-lg-1">
          <hr class="border-2 border-white opacity-100 m-0 py-2">
        </div>
      </div>
    </div>
    
  </div>
</div>

<div class="container py-5 bg-light ">
  <app-gallery ></app-gallery>
</div>
