<section
  class="card border border-light-subtle shadow-sm p-3 p-md-4 d-flex flex-column notice-board"
  aria-labelledby="notice-board-heading">

  <h2 id="notice-board-heading"
    class="fw-bold text-uppercase fs-4 mb-3 pb-2 border-bottom border-4 border-warning d-inline-block text-dark align-self-start">
    Notice Board
  </h2>

  <ul class="nav nav-tabs flex-shrink-0 mb-3" role="tablist" aria-label="Notice board categories">
    @for (tab of tabs; track tab.id) {
      <li class="nav-item" role="presentation">
        <button
          type="button"
          class="nav-link p-2 fw-medium text-black border-dark-subtle rounded-0"
          [class.active]="activeTab === tab.id"
          [id]="'tab-' + tab.id"
          role="tab"
          [attr.aria-controls]="'tab-panel-' + tab.id"
          [attr.aria-selected]="activeTab === tab.id ? 'true' : 'false'"
          (click)="setTab(tab.id)">
          {{ tab.label }}
        </button>
      </li>
    }
  </ul>

  <div class="overflow-y-auto "
    [id]="'tab-panel-' + activeTab"
    role="tabpanel"
    [attr.aria-labelledby]="'tab-' + activeTab">

    @if (currentNotices.length === 0) {
      <p class="text-muted small">No items available.</p>
    }

    <ul class="list-unstyled mb-0" role="list">
      @for (notice of currentNotices; track notice.title) {
        <li class="d-flex align-items-start gap-3 py-2 border-bottom border-light-subtle">
          <i class="bi bi-circle-fill text-warning mt-1 small flex-shrink-0" aria-hidden="true"></i>
          <div>
            <a [href]="notice.link"
              class="text-dark fw-medium text-decoration-none d-block mb-1"
              target="_blank"
              rel="noopener noreferrer">
              {{ notice.title }}
            </a>
            <div class="small text-muted">Published on: {{ notice.date }}</div>
          </div>
        </li>
      }
    </ul>
  </div>

  <div class="mt-auto pt-2 flex-shrink-0">
    <a [routerLink]="[activeRoute]"
      class="btn btn-warning text-dark fw-bold px-2 py-1 border-2 lh-1"
      [attr.aria-label]="'View all ' + activeTab + ' notices'">
      View More
    </a>
  </div>

</section>
