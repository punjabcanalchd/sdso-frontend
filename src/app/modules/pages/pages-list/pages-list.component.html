<div class="container-fluid p-3">
    <app-document-list 
        title="Pages" 
        [isAdmin]="true"
         /* [isLoading]="isLoading" */
         [data]="data" 
        [columns]="tableColumns" 
        [showCreateButton]="true"
         /* [isServerSide]="true", */
        /* [totalServerRecords]="totalRecords", */
        /* (serverAction)="onServerAction($event)", */
         (createClick)="openCreateModal()"
        (actionClick)="handleAction($event)"     
        >
    </app-document-list>
</div>


<app-modal-form 
    [title]="isEditMode ? 'Edit Page' : 'Create Page'"
    [schema]="pageSchema"
    [initialValue]="formInitialData"
    size="xl"
    (submitForm)="onSubmit($event)"
    (modalClosed)="onModalClosed()">
</app-modal-form>
