<main id="main-content" tab="-1">

  <section class="p-3  bg-white d-flex align-items-center min-vh-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-12 col-xl-12">

          <!-- Main Card -->
          <div class="card border border-light-subtle rounded-2 shadow-sm bg-white"
            *ngIf="isProfileLoaded; else loadingTemplate">
            <div class="p-4 p-md-5 d-flex flex-column justify-content-center">

              <!-- Title & User Avatar -->
              <div class="d-flex align-items-center gap-3 mb-4 pb-2 border-bottom border-light-subtle">

                <!-- Clean Initials Avatar -->
               <div 
               class="bg-primary avatar-circle text-white rounded-circle d-flex align-items-center justify-content-center shadow-sm lh-1 p-3 px-4">
                <span class="m-0 fw-bold fs-3">
                  {{ (displayName || 'U').charAt(0).toUpperCase() }}
               </span>
              </div>

                <!-- Title -->
                <div>
                  <h2
                    class="fs-4 fw-bold text-dark text-uppercase pb-1 mb-0 border-bottom border-warning border-3 d-inline-block">
                    {{ isViewMode ? 'View Profile' : 'Edit Profile' }}
                  </h2>
                  <p class="text-secondary small mb-0 mt-1 fw-medium">
                    <i class="bi bi-envelope me-1"></i> {{ displayEmail }}
                  </p>
                </div>

              </div>

              <!-- Description -->
              <p class="text-muted small mb-1 ">
                {{ isViewMode ? 'Viewing personal information and contact details.' : 'Update your personal information and contact details below.' }}
              </p>

              <main class="py-2">

                <!-- The Actual Form -->
                <app-dynamic-form [schema]="editProfileSchema" [initialValue]="userData"
                  (buttonClick)="handleFormEvent($event)">
                </app-dynamic-form>

              </main>

            </div>
          </div>

          <!-- Initial Auth Loading State -->
          <ng-template #loadingTemplate>
            <div class="text-center py-5 my-5">
              <div class="spinner-border text-primary p-3" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="mt-3 text-muted fw-medium fs-5">Loading profile...</p>
            </div>
          </ng-template>

        </div>
      </div>
    </div>
  </section>
</main>
<!-- Password Change Modal -->
<app-modal-form
  title="Change Password"
  [schema]="passwordSchema"
  [isLoading]="isPasswordLoading"
  (buttonClick)="handlePasswordSubmit($event)">
</app-modal-form>
