
<main id="main-content" tab="-1">
<section class="py-5 my-4 bg-white d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-8">
        <div class="card border border-light-subtle rounded-4 shadow-sm bg-white">
          <div class="p-4 p-md-5 d-flex flex-column justify-content-center">
         
          <div class="d-flex flex-column align-items-center justify-content-center text-center gap-2 mb-4 pb-3 border-bottom border-light-subtle d-lg-none">
            
            <div class="col-5 col-sm-2">
              <div class="ratio ratio-1x1 border border-secondary border-2 rounded-circle bg-primary p-1">
                <div class="d-flex align-items-center justify-content-center h-100 w-100">
                  <img [src]="APP_ASSETS.LOGO" class="img-fluid rounded-circle" alt="SDSO Logo">
                </div>
              </div>
            </div>
            
            <div class="mt-2">
              <span class="fw-bold text-dark fs-5 d-block lh-1">SDSO</span>
              <span class="text-secondary small d-block mt-1 fw-semibold">Secure Access</span>
            </div>
          </div>
          <div class="mb-2">
            <h2 class="fs-4 fw-bold text-dark text-uppercase pb-1 mb-0 border-bottom border-warning border-3 d-inline-block">
              Change Password
            </h2>
          </div>
          <p class="text-muted small mb-4 mt-2 fs-6">Please enter your current and new secure password below.</p>

          <main class=" py-2">


                <div *ngIf="isLoading" class="text-center mb-3 font_color">
                  <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                  <span class="small fw-medium">Saving password...</span>
                </div>

            <app-dynamic-form
              [schema]="passwordSchema"
              (submitForm)="onSubmit($event)">
            </app-dynamic-form>
              
          </main>

          <div class="mt-4 pt-3 border-top border-light-subtle text-center">
            <div>
              <a routerLink="/auth/user-profile" class="text-decoration-none text-secondary link-dark small d-inline-flex align-items-center gap-1 fw-medium">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
                <span>Back to Profile</span>
              </a>
            </div>
          </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</main>
