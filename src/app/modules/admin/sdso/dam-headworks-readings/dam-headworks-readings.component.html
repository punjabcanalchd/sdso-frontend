<div class="container-fluid p-3">
    <app-document-list 
        title="Dam/ Headworks Daily Reading"
        [isAdmin]="true" 
        [data]="data" 
        [columns]="tableColumns" 
        [showCreateButton]="true"
        [currentPage]="pagination.current_page"
        [lastPage]="pagination.last_page"
        [pageSize]="pagination.per_page"
        [totalItems]="pagination.total"
        (pageSizeChange)="onPageSizeChange($event)"
        (pageChange)="loadDamHeadWorksReadings($event)"
        (searchChange)="searchDamHeadWorksReadings($event)"
        (sortChange)="sortDamHeadWorksReadings($event)"
        (createClick)="openCreateModal()"
        (actionClick)="handleAction($event)">
    </app-document-list>
</div>
<app-modal-form 
    #createDamHeadWorksReadingsModal
    [title]="isEditMode ? 'Edit Dam/ Headworks Daily Reading' : 'Create Dam/ Headworks Daily Reading'"
    [schema]="DamHeadWorksReadingsSchema"  
    [initialValue]="formInitialData"
    size="xl"
    (submitForm)="onSubmit($event)">
</app-modal-form>
