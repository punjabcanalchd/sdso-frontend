<div class="p-3 mw-100">
  <div class="card shadow-sm border border-secondary-subtle rounded-2">
    
    <!-- Header -->
    <div class="card-header border-1 py-3 ps-3 bg-white d-flex justify-content-between align-items-center gap-4">
      <h1 class="fs-4 fw-bold text-uppercase pb-1 ps-0 pe-0 mb-0 border-bottom border-warning border-3 d-inline-block text-dark">
        {{ title }}
      </h1>
    </div>

    <div class="application-stepper-container bg-white p-3 rounded-2 shadow-sm border">

      <div *ngIf="isLoading" class="d-flex justify-content-center align-items-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <app-dynamic-form
        *ngIf="!isLoading"
        [schema]="settingSchema"
        [isEditMode]="true"
        [saveByTab]="true"
        [formData]="generalSettings"
        [initialData]="generalSettings"
        (tabChange)="onTabChange($event)"
        (submitForm)="onSubmit($event)"
      >
      </app-dynamic-form>

    </div>
  </div>
</div>
