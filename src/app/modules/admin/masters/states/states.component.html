<div class="container-fluid p-3">
    <app-document-list 
        title="States"
        [isAdmin]="true" 
        [data]="data" 
        [columns]="tableColumns" 
        [showCreateButton]="true"
        [currentPage]="pagination.current_page"
        [lastPage]="pagination.last_page"
        [pageSize]="pagination.per_page"
        [totalItems]="pagination.total"
        (pageChange)="loadStates($event)"
        (searchChange)="searchStates($event)"
        (sortChange)="sortStates($event)"
        (createClick)="openCreateModal()"
        (actionClick)="handleAction($event)">
    </app-document-list>
</div>
<app-modal-form 
    #createStatesModal
    [title]="isEditMode ? 'Edit State' : 'Create State'"
    [schema]="stateSchema"  
    [initialValue]="formInitialData"
    size="xl"
    (submitForm)="onSubmit($event)">
</app-modal-form>
