<div class="container-fluid p-3">

  <!-- ── FILTER PANEL ──────────────────────────────────────────── -->
  <app-dynamic-filter
    [schema]="filterSchema"
    (filter)="onFilter($event)"
    (reset)="resetFilter()"
    (fieldChange)="onFilterFieldChange($event)">
  </app-dynamic-filter>
  <!-- ── END FILTER PANEL ──────────────────────────────────────── -->

    <app-document-list 
        title="Users"
        [isAdmin]="true" 
        [data]="data" 
        [columns]="tableColumns" 
        [showCreateButton]="true"
        [currentPage]="pagination.current_page"
        [lastPage]="pagination.last_page"
        [pageSize]="pagination.per_page"
        [totalItems]="pagination.total"
        (pageChange)="loadUsers($event)"
        (pageSizeChange)="onPageSizeChange($event)"
        (searchChange)="searchUsers($event)"
        (sortChange)="sortUsers($event)"
        (createClick)="openCreateModal()"
        (actionClick)="handleAction($event)">
    </app-document-list>
</div>
<app-modal-form 
    #createUserModal
    [title]="'Create User'"
    [schema]="userSchema"  
    [initialValue]="formInitialData"
    size="xl"
    (submitForm)="onSubmit($event)"
    (formReady)="setupCascadingDropdowns($event)">
</app-modal-form>

<app-modal-form 
    #viewProfileModal
    [title]="'View Profile'"
    [schema]="isProfileLoading ? null : viewProfileSchema"
    [initialValue]="profileInitialData"
    [isLoading]="isProfileLoading">
</app-modal-form>

<app-modal-form 
    #updateEmailModal
    [title]="'Update Profile'"
    [schema]="updateProfileSchema"
    [initialValue]="updateEmailInitialValue"
    size="xl"
    (submitForm)="onUpdateEmailSubmit($event)">
</app-modal-form>
