<div class="container-fluid p-3">
  <app-document-list
     title="Notice Board"
    [isAdmin]="true"
    [data]="data"
    [columns]="tableColumns"
    [showCreateButton]="true"
    (createClick)="openCreateModal()"
    (actionClick)="handleAction($event)"
  >
  </app-document-list>
</div>

<app-modal-form
  [title]="isEditMode ? 'Edit Notice Board' : 'Create Notice Board'"
  [schema]="noticeboardSchema"
  [initialValue]="formInitialData"
  size="xl"
  (submitForm)="onSubmit($event)"
  (modalClosed)="onModalClosed()"
>
</app-modal-form>
