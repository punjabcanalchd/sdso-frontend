<div class="container-fluid p-3">

  <!-- Category Tabs (General / Homepage / Errors) -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item" *ngFor="let tab of tabs">
      <button 
        type="button" 
        class="nav-link"
        [class.active]="selectedGroup === tab.value"
        (click)="selectTab(tab.value)">
        {{ tab.label }}
      </button>
    </li>
  </ul>

  <!-- Reusable Document List -->
  <app-document-list
    title="Translations"
    [isAdmin]="true"
    [data]="data"
    [columns]="tableColumns"
    [showCreateButton]="true"
    [currentPage]="pagination.current_page || 1"
    [lastPage]="pagination.last_page || 1"
    [pageSize]="pagination.per_page || 25"
    [totalItems]="pagination.total || 0"
    (pageSizeChange)="onPageSizeChange($event)"
    (pageChange)="loadTranslations($event)"
    (searchChange)="onSearchChange($event)"
    (sortChange)="onSortChange($event)"
    (createClick)="openCreateModal()">
  </app-document-list>

</div>

<app-modal-form
  title="Create Translation"
  [schema]="translationSchema"
  [initialValue]="formInitialData"
  size="lg"
  (submitForm)="onSubmit($event)"
  (modalClosed)="onModalClosed()">
</app-modal-form>
