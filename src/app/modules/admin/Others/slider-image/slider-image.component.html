<div class="container-fluid p-3">

 
  <app-document-list
    title="{{sliderName}}"
    [isAdmin]="true"
    [data]="data"
    [columns]="tableColumns"
    [showCreateButton]="true"
    [currentPage]="pagination.current_page"
    [lastPage]="pagination.last_page"
    [pageSize]="pagination.per_page"
    [totalItems]="pagination.total"
    (pageSizeChange)="onPageSizeChange($event)"
    (pageChange)="loadSliderImages($event)"
    (searchChange)="searchSliderImages($event)"
    (sortChange)="sortSliderImages($event)"
     (createClick)="openCreate()"
    (actionClick)="handleAction($event)">
  </app-document-list>
</div>

<app-modal-form  #sliderImageModal
  [title]="isEditMode ? 'Edit Slider Image' : 'Add Slider Image'" 
 [schema]="sliderImageSchema"
  [initialValue]="formInitialData"
  size="xl*"
  (submitForm)="onSubmit($event)"
  (modalClosed)="onModalClosed()" >
</app-modal-form>
