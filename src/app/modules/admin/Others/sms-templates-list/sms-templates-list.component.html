<div class="container-fluid p-3">
  <app-document-list
    title="SMS Templates"
    [isAdmin]="true"
    [data]="data"
    [columns]="tableColumns"
    [showCreateButton]="true"
    [currentPage]="pagination.current_page || 1"
    [lastPage]="pagination.last_page || 1"
    [pageSize]="pagination.per_page || 25"
    [totalItems]="pagination.total || 0"
    (pageSizeChange)="onPageSizeChange($event)"
    (pageChange)="loadTemplates($event)"
    (searchChange)="searchTemplates($event)"
    (sortChange)="sortTemplates($event)"
    (createClick)="openCreateModal()"
    (actionClick)="handleAction($event)">
    
  </app-document-list>
</div>
<app-modal-form 
    #createSmsTemplateModal
    [title]="isEditMode ? 'Edit SMS Template' : 'Create SMS Template'"
    [schema]="SMSTemplateSchema"  
    [initialValue]="formInitialData"
    size="xl"
    (submitForm)="onSubmit($event)">
</app-modal-form>
