<div class="card border-0 shadow-sm mb-3">
  <div class="card-body py-3 px-3">
    <div class="row g-2 align-items-end">

      <!-- Dynamic Fields -->
      <ng-container *ngFor="let field of schema">
        <div [class]="field.colClass || 'col-md-3 col-sm-6'">
          <label class="form-label fw-semibold small mb-1">{{ field.label }}</label>
          
          <!-- Select Field -->
          <ng-container *ngIf="field.type === 'select'">
            <select class="form-select form-select-sm"
                    [ngModel]="values[field.name]"
                    (ngModelChange)="onModelChange(field.name, $event)"
                    [disabled]="field.disabled || false">
              <option value="">Please Select</option>
              <option *ngFor="let opt of field.options" [value]="opt.value">{{ opt.label }}</option>
            </select>
          </ng-container>

          <!-- Text Field -->
          <ng-container *ngIf="field.type === 'text'">
            <input type="text" 
                   class="form-control form-control-sm"
                   [ngModel]="values[field.name]"
                   (ngModelChange)="onModelChange(field.name, $event)"
                   [disabled]="field.disabled || false"
                   placeholder="Search..." />
          </ng-container>
          
          <!-- Date Field -->
          <ng-container *ngIf="field.type === 'date'">
            <input type="date" 
                   class="form-control form-control-sm"
                   [ngModel]="values[field.name]"
                   (ngModelChange)="onModelChange(field.name, $event)"
                   [disabled]="field.disabled || false" />
          </ng-container>
          
        </div>
      </ng-container>

      <!-- Action Buttons -->
      <div class="col-md-3 col-sm-6 d-flex gap-2" *ngIf="showFilterButton || showResetButton">
        <button *ngIf="showFilterButton" type="button" class="btn btn-primary btn-sm d-flex align-items-center gap-1 px-3" (click)="onFilterClick()">
          <i class="bi bi-funnel-fill"></i> Filter
        </button>
        <button *ngIf="showResetButton" type="button" class="btn btn-secondary btn-sm d-flex align-items-center gap-1 px-3" (click)="onResetClick()">
          <i class="bi bi-arrow-clockwise"></i> Reset
        </button>
      </div>

    </div>
  </div>
</div>
