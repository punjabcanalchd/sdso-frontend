<div class="time-picker">

  <label
    *ngIf="label"
    class="form-label"
  >
    {{ label }}
  </label>

 <input
  type="time"
  class="form-control"
  [formControl]="control"
  [placeholder]="placeholder"
  (change)="onTimeChange($event)"
/>

<div
  class="invalid-feedback d-block"
  *ngIf="control.touched && control.invalid"
>
  <small *ngIf="control.errors?.['required']">
    Time is required
  </small>
</div>
