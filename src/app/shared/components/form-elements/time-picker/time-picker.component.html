<div class="time-picker">

  <input
    type="time"
    class="form-control"
    [formControl]="control"
    [placeholder]="placeholder"
    [readonly]="readonly"
    [disabled]="disabled"
  />

  <div
    *ngIf="control?.touched && control?.invalid"
    class="text-danger mt-1"
  >
  </div>

</div>
