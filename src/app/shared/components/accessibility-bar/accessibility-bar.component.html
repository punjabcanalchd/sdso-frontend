<div class="container-fluid bg-light-subtle border-bottom">

  <!-- Desktop -->
  <div class="row align-items-center d-none d-md-flex py-2 accessibility_bk">

    <!-- Left -->
    <div class="col-md-3">
        <i class="bi bi-calendar3 me-2"></i>
        <span class="small text-secondary">
          {{ currentDateTime | date:'dd MMM yyyy, hh:mm:ss a' }}
        </span>
    </div>

    <!-- Center -->
    <div class="col-md-6 text-center">
      <h2 class="h5 fw-bold text-dark mb-0">
        State Dam Safety Organization (SDSO) | Dam Safety Organisation
      </h2>
    </div>

    <!-- Right -->
    <div class="col-md-3">

      <div class="d-flex justify-content-end align-items-center flex-wrap gap-2">

        <!-- Skip -->
        <a
          href="#main-content"
          class="btn btn-link text-secondary text-decoration-none p-1 d-flex align-items-center gap-1">

          <i class="bi bi-arrow-down"></i>
          <span>Skip</span>

        </a>

        <div class="vr"></div>

        <!-- Search -->
        <div class="position-relative">

          <button
            type="button"
            class="btn btn-link text-secondary text-decoration-none p-1 d-flex align-items-center gap-1"
            (click)="toggleSearch()">

            <i class="bi bi-search"></i>
            <span>Search</span>

          </button>

          @if (isSearchOpen) {
          <div class="position-absolute end-0 mt-2 bg-white border rounded shadow p-2" style="min-width:260px; z-index:1050;">

            <form
              class="d-flex gap-2"
              (ngSubmit)="onSearch($event)">

              <input
                class="form-control form-control-sm"
                type="search"
                [(ngModel)]="searchQuery"
                name="searchQuery"
                placeholder="Search...">

              <button
                class="btn btn-outline-success btn-sm"
                type="submit">

                <i class="bi bi-arrow-right"></i>

              </button>

            </form>

          </div>
          }

        </div>

        <div class="vr"></div>

        <!-- Font Size -->

        <div class="btn-group btn-group-sm">

          <button
            class="btn btn-outline-secondary"
            (click)="decreaseFontSize()"
            [disabled]="currentFontSize===90">

            A-

          </button>

          <button
            class="btn btn-outline-secondary"
            (click)="increaseFontSize()"
            [disabled]="currentFontSize===130">

            A+

          </button>

        </div>

        <div class="vr"></div>

        <!-- Sitemap -->

        <a
          href="/sitemap"
          class="btn btn-link text-secondary text-decoration-none p-1 d-flex align-items-center gap-1">

          <i class="bi bi-diagram-3"></i>
          <span>Sitemap</span>

        </a>

      </div>

    </div>

  </div>

  <!-- Mobile -->

  <div class="d-md-none py-2">

    <div class="d-flex justify-content-between align-items-center">

      <h2 class="h6 fw-bold text-dark mb-0">
        State Dam Safety Organization
      </h2>

      <div class="d-flex align-items-center gap-1">

        <button
          class="btn btn-link text-secondary p-1"
          (click)="toggleSearch()">

          <i class="bi bi-search"></i>

        </button>

        <button
          class="btn btn-outline-secondary btn-sm"
          (click)="decreaseFontSize()">

          A-

        </button>

        <button
          class="btn btn-outline-secondary btn-sm"
          (click)="increaseFontSize()">

          A+

        </button>

        <a
          href="/sitemap"
          class="btn btn-link text-secondary p-1">

          <i class="bi bi-diagram-3"></i>

        </a>

      </div>

    </div>

    @if (isSearchOpen) {
    <div class="mt-2">

      <form
        class="d-flex gap-2"
        (ngSubmit)="onSearch($event)">

        <input
          class="form-control form-control-sm"
          type="search"
          [(ngModel)]="searchQuery"
          name="searchQuery"
          placeholder="Search...">

        <button
          class="btn btn-outline-success btn-sm"
          type="submit">

          <i class="bi bi-arrow-right"></i>

        </button>

      </form>

    </div>
    }

  </div>

</div>
