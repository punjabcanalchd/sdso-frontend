<!-- Notice Board + Important Links -->
<section class="py-4" aria-labelledby="notice-board-heading">
  <div class="container">
    <div class="row g-4 align-items-stretch">

      <!-- Notice Board with Dynamic Tabs -->
      <div class="col-lg-8 col-md-12">
        <app-notice-board class="d-block h-100"></app-notice-board>
      </div>

      <!-- Important Links -->
      <div class="col-lg-4 col-md-12">
        <div class="card border border-light-subtle shadow-sm h-100">

          <!-- Card Header -->
          <div class="card-header bg-primary text-white">
            <h2 class="h5 mb-0 d-flex align-items-center gap-2">
              <span class="material-icons small" aria-hidden="true">link</span>
              Important Links
            </h2>
          </div>

          <!-- Links -->
          <div class="card-body p-0">
            <ul class="list-group list-group-flush" role="list">

              <li
                *ngFor="let link of importantLinks"
                class="list-group-item"
                role="listitem">

                <a
                  [href]="link.url"
                  class="text-decoration-none d-flex align-items-center gap-2"
                  [attr.target]="link.external ? '_blank' : null"
                  [attr.rel]="link.external ? 'noopener noreferrer' : null"
                  [attr.aria-label]="link.label + (link.external ? ' (opens in new tab)' : '')">

                  <span class="material-icons small" aria-hidden="true">
                    open_in_new
                  </span>

                  {{ link.label }}

                </a>

              </li>

            </ul>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
