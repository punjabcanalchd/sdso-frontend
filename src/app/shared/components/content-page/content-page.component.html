<main class="container-lg py-4 py-md-5">
  
  <div class="mb-4" *ngIf="breadcrumbs.length > 0">
    <app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>
  </div>

  <div class="mb-4" *ngIf="title">
    <h1 class="fs-4 fw-bold text-uppercase pb-2 mb-0 border-bottom border-warning border-3 d-inline-block text-dark">
      {{ title }}
    </h1>
  </div>

  <div class="page-content text-secondary-emphasis lh-lg">
    <ng-content></ng-content>
  </div>

</main>
