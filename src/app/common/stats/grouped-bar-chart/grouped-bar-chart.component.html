<div class="card shadow-sm border-0 w-100 h-100 p-2 ">
    <div class="card-header p-1 d-flex justify-content-between bg-white border-0">
        <h6 class="mb-0">{{ title }}</h6>
        <i class="bi-info-circle text-muted"></i>
    </div>
    <div class=" card-body d-flex flex-column p-0 ">
        <apx-chart class="flex-fill" [series]="chartOptions.series" [chart]="chartOptions.chart"
            [plotOptions]="chartOptions.plotOptions" [dataLabels]="chartOptions.dataLabels"
            [stroke]="chartOptions.stroke" [xaxis]="chartOptions.xaxis" [yaxis]="chartOptions.yaxis"
            [fill]="chartOptions.fill" [tooltip]="chartOptions.tooltip" [style.height.px]="height" [colors]="chartOptions.colors">
        </apx-chart>
    </div>
</div>
