<div class="card shadow-sm border-0 w-100 h-100 p-2 ">
    <div class="card-header p-1 d-flex bg-white border-0 justify-content-between">
        <h6 class="mb-0">{{ title }}</h6>
        <i class="bi-info-circle text-muted"></i>
    </div>
    <div class="card-body d-flex flex-column p-0 ">
        <apx-chart class="flex-fill" [series]="chartOptions.series" [chart]="chartOptions.chart"
            [labels]="chartOptions.labels" [legend]="chartOptions.legend" [colors]="chartOptions.colors" [dataLabels]="chartOptions.dataLabels"
            [tooltip]="chartOptions.tooltip" [style.height.px]="height">
        </apx-chart>
    </div>
</div>
