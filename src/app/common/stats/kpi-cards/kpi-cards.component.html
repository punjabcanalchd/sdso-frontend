<section class="kpi-cards-section" aria-labelledby="kpi-cards-heading">
    <h2 id="kpi-cards-heading" class="visually-hidden">Application Statistics</h2>
    <div class="container-fluid px-0">
        <div class="row g-2 row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-5">

            @for (card of kpiCards; track card.id) {
            <div class="col">
                <div
                    class="card h-100 p-3 bg-white border-0 shadow-sm d-flex flex-column justify-content-between  hover-lift">

                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <div class="p-2 d-flex align-items-center justify-content-center rounded-circle flex-shrink-0 lh-1  hover-zoom "
                            [ngClass]="[card.bgClass, card.textClass]">
                            <i class="bi {{ card.icon }} fs-3" aria-hidden="true"></i>
                        </div>

                        <div class="flex-grow-1 min-w-0 ms-2">
                            <div class="d-flex justify-content-between align-items-center">
                                <h3 class="text-secondary mb-0 fw-small small text-truncate">{{ card.label }}</h3>

                                <div class="position-relative">
                                        <i class="bi bi-info-circle small cursor-pointer" aria-hidden="true"></i>
                                </div>
                            </div>
                            <div class="fw-bold fs-6 lh-1 text-dark text-truncate">{{ card.count }}</div>
                        </div>
                    </div>
                    <div
                        class="d-flex align-items-center justify-content-between  mt-2 text-dark border-top border-light ">

                        @for (type of statusTypes; track type.key; let isLast = $last) {
                        <div class="d-flex flex-column align-items-center">
                            <div class="d-flex align-items-center pt-2">
                                <small class="text-nowrap lh-1 text-muted fw-normal">{{ type.label }}</small>
                            </div>
                            <span class="small fw-bold text-dark align-self-center">{{ card[type.key] }}</span>
                        </div>

                        @if (!isLast) {
                        <div class="vr text-secondary align-self-stretch"></div>
                        }
                        }
                    </div>

                </div>
            </div>
            }

        </div>
    </div>
</section>
