<section class="kpi-cards-section" aria-labelledby="kpi-cards-heading">
    <h2 id="kpi-cards-heading" class="visually-hidden">Application Statistics</h2>
    <div class="container-fluid px-0">
        <div class="row g-2 row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-12">

            @for (card of kpiCards; track card.id) {
            <div class="col">
                <div
                    class="card h-100 p-3 bg-white border-0 shadow-sm d-flex flex-column justify-content-between  hover-lift">

                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <div class="p-2 d-flex align-items-center justify-content-center rounded-circle flex-shrink-0 lh-1  hover-zoom "
                            [ngClass]="[card.bgClass, card.textClass]">
                            <i class="bi {{ card.icon }} fs-3" aria-hidden="true"></i>
                        </div>

                        <div class="flex-grow-1 min-w-0 ms-2">
                            <div class="d-flex justify-content-between align-items-center">
                                <h3 class="text-secondary mb-0 fw-small small text-truncate">{{ card.label }}</h3>

                                <div class="position-relative">
                                        <i class="bi bi-info-circle small cursor-pointer" aria-hidden="true"></i>
                                </div>
                            </div>
                            <div class="fw-bold fs-6 lh-1 text-dark text-truncate">{{ card.count }}</div>
                        </div>
                    </div>

                </div>
            </div>
            }

        </div>
    </div>
</section>
