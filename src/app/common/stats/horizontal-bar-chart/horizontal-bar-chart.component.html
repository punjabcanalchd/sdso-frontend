<div class="card shadow-sm border-0 w-100 h-100 p-2 ">
    <div class="card-header p-1 d-flex bg-white border-0 justify-content-between">
        <h6 class="mb-0">{{ title }}</h6>
        <i class="bi-info-circle text-muted"></i>
    </div>
    <div class="card-body d-flex flex-column p-0">
        <apx-chart [series]="chartOptions.series" [chart]="chartOptions.chart" [plotOptions]="chartOptions.plotOptions"
            [dataLabels]="chartOptions.dataLabels" [xaxis]="chartOptions.xaxis" [yaxis]="chartOptions.yaxis"
            [fill]="chartOptions.fill" [tooltip]="chartOptions.tooltip" [grid]="chartOptions.grid" [colors]="chartOptions.colors" [style.height.px]="height"></apx-chart>
    </div>
</div>
